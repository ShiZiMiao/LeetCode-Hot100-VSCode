name: Publish Extension to VS Code Marketplace

# 触发方式：
# 1. GitHub Release 发布后自动执行（推荐，跟随发版习惯）
# 2. 手动触发（Actions 页面 Run workflow）
#
# 认证方式：OIDC 可信发布（无需 PAT / Azure DevOps）。
# 前置要求：在 https://marketplace.visualstudio.com/manage 的发布者设置中
#   为 ShiZiMiao.leetcode 配置 Trusted Publishing 信任策略，
#   关联本仓库与工作流 publish-marketplace.yml（GitHub Actions 为受信任来源）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 可信发布需要向 GitHub 申请 OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # @vscode/vsce@next（OIDC 支持所在版本线）要求 Node >= 22
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与本地发布完全一致：--no-dependencies（pnpm 布局兼容）、--skip-license（LICENSE 校验冲突）
      # --readme-path：商店页用 MARKETPLACE.md（无 fork 归属声明；GitHub 首页仍用 README.md）
      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --out Hot100-for-VSCode.vsix --no-dependencies --skip-license --readme-path MARKETPLACE.md

      # --packagePath 直接上传已打包产物，不会执行 npm version / git tag 等操作；
      # --oidc 用 GitHub Actions OIDC 交换短期 Marketplace 凭证。
      # 注意：--oidc 仅在 @vscode/vsce@next（3.9.3 系列）存在，latest(3.9.2) 无此选项；
      #       该选项被上游 hideHelp() 隐藏，--help 看不到，但实际可用。
      #       前置：需在 Marketplace 发布者管理端配置本仓库+工作流的 Trusted Publishing 策略。
      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce@next publish --packagePath Hot100-for-VSCode.vsix --oidc