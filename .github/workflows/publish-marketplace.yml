name: Publish Extension to VS Code Marketplace

# 触发方式：
# 1. GitHub Release 发布后自动执行（推荐，跟随发版习惯）
# 2. 手动触发（Actions 页面 Run workflow）
#
# 认证方式：OIDC 可信发布（无需 PAT / Azure DevOps）。
# 前置要求：在 https://marketplace.visualstudio.com/manage 的发布者设置中
#   为 ShiZiMiao.leetcode 配置 Trusted Publishing 信任策略，
#   关联本仓库与工作流 publish-marketplace.yml（GitHub Actions 为受信任来源）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 可信发布需要向 GitHub 申请 OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与本地发布完全一致：--no-dependencies（pnpm 布局兼容）、--skip-license（LICENSE 校验冲突）
      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --out Hot100-for-VSCode.vsix --no-dependencies --skip-license

      # --packagePath 直接上传已打包产物，不会执行 npm version / git tag 等操作；
      # --oidc 使用 GitHub Actions OIDC 交换短期 Marketplace 凭证（vsce >= 3.9.3）
      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce@latest publish --packagePath Hot100-for-VSCode.vsix --oidc